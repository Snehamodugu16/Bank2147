<!DOCTYPE html>
<html>
<head>
  <title>Bank2147 Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .card {
      border: 1px solid #ccc;
      padding: 15px;
      width: 320px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    button {
      margin-top: 10px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .loader {
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>Dashboard</h2>

<p class="loader" data-testid="loader">Loading account details...</p>

<div class="card">

  <p><strong>Welcome:</strong>
    <span data-testid="welcome"></span>
  </p>

  <p><strong>Account Number:</strong>
    <span data-testid="account"></span>
  </p>

  <p><strong>Available Balance:</strong>
    ₹ <span data-testid="balance"></span>
  </p>

</div>

<!-- 🔗 Navigation Buttons -->

<a href="transfer.html">
  <button data-testid="go-transfer">Transfer Money</button>
</a>

<a href="transaction.html">
  <button data-testid="go-transactions">View Transactions</button>
</a>

<br><br>

<button onclick="logout()" data-testid="logout-btn">Logout</button>

<!-- ✅ JS Module -->
<script type="module" src="./js/dashboard.js"></script>

</body>
</html>
