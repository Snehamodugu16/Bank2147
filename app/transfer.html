<!DOCTYPE html>
<html>
<head>
  <title>Fund Transfer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .card {
      border: 1px solid #ccc;
      padding: 20px;
      width: 320px;
      border-radius: 8px;
    }

    .hidden {
      display: none;
    }

    button {
      margin-top: 10px;
      padding: 8px 14px;
      cursor: pointer;
    }

    #msg {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>Fund Transfer</h2>

<div class="card">

  <!-- 👤 Beneficiary -->
  <label>Select Beneficiary</label>
  <br><br>

  <select id="beneficiary" data-testid="beneficiary">
    <option value="">-- Select --</option>
    <option value="John">John</option>
    <option value="David">David</option>
    <option value="Alex">Alex</option>
  </select>

  <br><br>

  <!-- 💰 Amount -->
  <label>Enter Amount</label>
  <br><br>

  <input
    id="amount"
    type="number"
    placeholder="Enter amount"
    data-testid="amount"
  />

  <br><br>

  <!-- 🚀 Transfer Button -->
  <button onclick="transfer()" data-testid="transfer-btn">
    Transfer
  </button>

  <!-- ⏳ Loader -->
  <p class="hidden" data-testid="loader">Processing transaction...</p>

  <!-- ✅ / ❌ Message -->
  <p id="msg" data-testid="msg"></p>

</div>

<br>

<!-- 🔙 Back to Dashboard -->
<a href="dashboard.html">
  <button data-testid="back-dashboard">⬅ Back to Dashboard</button>
</a>

<!-- ✅ JS MODULE -->
<script type="module" src="./js/transfer.js"></script>

</body>
</html>
