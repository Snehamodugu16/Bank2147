<!DOCTYPE html>
<html>
<head>
  <title>Bank2147 Login</title>

  <style>
    .hidden { display: none; }
    .error { color: red; }
  </style>
</head>
<body>

<h2>Login</h2>

<input
  id="username"
  data-testid="username"
  placeholder="Username"
/>
<br><br>

<input
  id="password"
  type="password"
  data-testid="password"
  placeholder="Password"
/>

<button onclick="togglePassword()" data-testid="toggle-password">
  👁
</button>

<br><br>

<label>
  <input type="checkbox" id="rememberMe" data-testid="remember-me" />
  Remember Me
</label>

<br><br>

<button onclick="login()" data-testid="login-btn">
  Login
</button>

<p data-testid="loader" class="hidden">Logging in...</p>

<p data-testid="error-msg" class="error"></p>

<!-- ✅ LOAD MODULE -->
<script type="module" src="./js/login.js"></script>

</body>
</html>
